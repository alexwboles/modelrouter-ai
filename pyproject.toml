[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "modelrouter-ai"
version = "0.1.0"
description = "Free, self-hosted Fusion-style model router for open coding agents"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = []

[project.scripts]
modelrouter = "modelrouter.cli:main"

[tool.setuptools.packages.find]
include = ["modelrouter"]
